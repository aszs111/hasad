name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # مكتبة تيليجرام الجاهزة (نسخة Telegram X) — مثبّتة على إصدار معيّن عشان يطابق الكود
      - uses: actions/checkout@v4
        with:
          repository: TGX-Android/tdlib
          ref: f896c3f2dfbfe40203dddaa50c534108426e1f5c
          path: tgx-tdlib
          lfs: false

      - name: Pull only the native libs we need
        working-directory: tgx-tdlib
        run: |
          git lfs install --local
          git lfs pull --include="src/main/libs/*/android-29/**,openssl/*/android-29/**"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install matching NDK (for libc++_shared)
        run: |
          NDKV=$(ls tgx-tdlib/src/main/libs | sort -V | tail -1)
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;$NDKV" > /dev/null || true
          if [ -d "$ANDROID_HOME/ndk/$NDKV" ]; then echo "NDK_DIR=$ANDROID_HOME/ndk/$NDKV" >> $GITHUB_ENV; else echo "NDK_DIR=$ANDROID_NDK_LATEST_HOME" >> $GITHUB_ENV; fi

      - name: Copy TDLib into the app
        run: bash scripts/fetch-tdlib.sh tgx-tdlib "$NDK_DIR"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk "out/Hasad-1.0.${GITHUB_RUN_NUMBER}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: Hasad-apk
          path: out/*.apk

      - name: Publish release (download link for the phone)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: حصاد 1.0.${{ github.run_number }}
          files: out/*.apk
          make_latest: true
